<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070b10">
  <title>坐姿守护</title>
  <style>
    :root {
      --bg: #070b10;
      --surface: #0e141c;
      --surface-2: #131c27;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.14);
      --text: #e9eff7;
      --muted: #8698ad;
      --accent: #5b8cff;
      --accent-2: #7c5cff;
      --good: #3ddc97;
      --warn: #ffbf47;
      --bad: #ff6b81;
      --radius-lg: 26px;
      --radius-md: 18px;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body { min-height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(900px 500px at 50% -8%, rgba(91, 140, 255, 0.16), transparent 60%),
        radial-gradient(700px 380px at 100% 105%, rgba(124, 92, 255, 0.10), transparent 60%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }

    /* ---------- 顶栏 ---------- */
    .topbar { display: flex; align-items: center; justify-content: space-between; }

    .brand { display: flex; align-items: center; gap: 11px; }

    .logo {
      width: 40px; height: 40px; border-radius: 13px;
      display: grid; place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 24px rgba(91, 140, 255, 0.35);
    }
    .logo svg { width: 21px; height: 21px; }

    h1 { font-size: 17px; font-weight: 650; letter-spacing: 0.01em; }
    .sub {
      font-size: 9.5px; color: var(--muted);
      letter-spacing: 0.22em; margin-top: 3px;
      text-transform: uppercase;
    }

    .icon-btn {
      width: 42px; height: 42px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.045);
      color: var(--text);
      display: grid; place-items: center;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .icon-btn svg { width: 19px; height: 19px; }
    .icon-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.09); }
    .icon-btn.sm { width: 34px; height: 34px; border-radius: 11px; }

    /* ---------- 相机 ---------- */
    .camera-card {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #04070b;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      transition: border-color 0.35s ease, box-shadow 0.35s ease, aspect-ratio 0.35s ease;
      isolation: isolate;
    }
    body.show-details .camera-card { aspect-ratio: 1 / 1; }
    .camera-card[data-state="good"] { border-color: rgba(61, 220, 151, 0.38); }
    .camera-card[data-state="warn"] { border-color: rgba(255, 191, 71, 0.34); }
    .camera-card[data-state="bad"] {
      border-color: rgba(255, 107, 129, 0.6);
      box-shadow: 0 0 0 1px rgba(255, 107, 129, 0.22), 0 18px 46px rgba(255, 107, 129, 0.16);
    }

    video, canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1);
    }
    video { object-fit: cover; }
    #canvas { pointer-events: none; z-index: 1; }

    .vignette {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.34), transparent 26%, transparent 68%, rgba(0, 0, 0, 0.62));
    }

    .cam-placeholder {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px;
      color: rgba(134, 152, 173, 0.7);
      transition: opacity 0.3s ease;
    }
    .cam-placeholder svg { width: 56px; height: 56px; opacity: 0.45; }
    .cam-placeholder p { font-size: 12.5px; letter-spacing: 0.06em; }
    body.running .cam-placeholder { opacity: 0; }

    .cam-chip {
      position: absolute; top: 12px; left: 12px; z-index: 3;
      display: flex; align-items: center; gap: 7px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(6, 10, 15, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.12);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      font-size: 11.5px; color: #cfe0f5; letter-spacing: 0.02em;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s ease;
    }
    body.running .dot {
      background: var(--good);
      box-shadow: 0 0 0 4px rgba(61, 220, 151, 0.16);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.4; } }

    .calib {
      position: absolute; inset: 0; z-index: 4;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: rgba(4, 7, 11, 0.55);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .calib.show { opacity: 1; }

    .calib-ring {
      width: 134px; height: 134px; border-radius: 50%;
      display: grid; place-items: center;
      background: conic-gradient(var(--accent) 0deg, rgba(255, 255, 255, 0.1) 0deg);
      box-shadow: 0 0 48px rgba(91, 140, 255, 0.25);
      position: relative;
    }
    .calib-ring::after {
      content: ""; position: absolute; inset: 8px;
      border-radius: 50%; background: #0a1019;
    }
    .calib-inner { position: relative; z-index: 1; text-align: center; }
    #calibCount {
      font-size: 42px; font-weight: 700; line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .calib-inner small {
      display: block; margin-top: 5px;
      font-size: 10px; letter-spacing: 0.24em; color: var(--muted);
    }
    .calib p { font-size: 13px; color: #c9d7e8; }

    /* ---------- 状态 ---------- */
    .status-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 13px;
      padding: 15px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      transition: border-color 0.3s ease;
    }
    .status-card[data-state="bad"] { border-color: rgba(255, 107, 129, 0.35); }
    .status-card[data-state="good"] { border-color: rgba(61, 220, 151, 0.28); }

    .status-icon {
      width: 42px; height: 42px; border-radius: 13px;
      display: grid; place-items: center;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      transition: background 0.3s ease, color 0.3s ease;
    }
    .status-icon svg { width: 21px; height: 21px; }
    .status-card[data-state="good"] .status-icon { background: rgba(61, 220, 151, 0.12); color: var(--good); }
    .status-card[data-state="warn"] .status-icon { background: rgba(255, 191, 71, 0.12); color: var(--warn); }
    .status-card[data-state="bad"] .status-icon { background: rgba(255, 107, 129, 0.14); color: var(--bad); }

    .status-body { min-width: 0; }

    #postureBar {
      font-size: 15px; font-weight: 600;
      line-height: 1.35;
      color: var(--muted);
      transition: color 0.3s ease;
      overflow: hidden; text-overflow: ellipsis;
    }
    #postureBar.good { color: var(--good); }
    #postureBar.warn { color: var(--warn); }
    #postureBar.bad { color: var(--bad); }

    .status-hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

    .status-badge {
      min-width: 46px;
      text-align: center;
      padding: 7px 9px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .status-badge span { font-size: 15px; font-weight: 650; }
    .status-badge small { font-size: 9.5px; margin-left: 2px; }
    .status-card:not([data-state="bad"]) .status-badge { opacity: 0; }
    .status-badge { transition: opacity 0.25s ease, background 0.3s ease, color 0.3s ease; }
    .status-card[data-state="bad"] .status-badge { background: rgba(255, 107, 129, 0.14); color: var(--bad); }

    .bad-track {
      height: 4px; margin-top: 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .status-card[data-state="bad"] .bad-track { opacity: 1; }
    .bad-fill {
      height: 100%; width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--warn), var(--bad));
      transition: width 0.2s linear;
    }

    /* ---------- 数据 ---------- */
    .metrics {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .metrics.show { display: grid; }

    .metric {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 12px 14px;
    }
    .metric .k {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 11px; color: var(--muted);
    }
    .metric .k em {
      font-style: normal; font-size: 8.5px;
      letter-spacing: 0.14em; color: rgba(134, 152, 173, 0.55);
    }
    .metric .v {
      margin-top: 7px;
      font-size: 22px; font-weight: 650;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }
    .metric .u { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 3px; }
    .metric.wide { grid-column: 1 / -1; }

    /* ---------- 底部按钮 ---------- */
    .dock {
      position: sticky; bottom: 0;
      display: flex; gap: 10px;
      padding-top: 6px;
      margin-top: auto;
      background: linear-gradient(180deg, rgba(7, 11, 16, 0), rgba(7, 11, 16, 0.92) 40%);
    }

    .primary {
      flex: 1; height: 54px;
      border: none; border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-family: inherit;
      font-size: 16px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 10px 26px rgba(91, 140, 255, 0.33);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }
    .primary svg { width: 18px; height: 18px; }
    .primary:active { transform: scale(0.985); }
    .primary:disabled {
      opacity: 0.62;
      box-shadow: none;
      filter: saturate(0.7);
    }

    .ghost {
      height: 54px; padding: 0 17px;
      border-radius: 18px;
      border: 1px solid var(--line-strong);
      background: rgba(255, 255, 255, 0.045);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      display: flex; align-items: center; gap: 7px;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .ghost svg { width: 17px; height: 17px; color: var(--muted); }
    .ghost:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.09); }

    /* ---------- 语音设置面板 ---------- */
    .backdrop {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(2, 5, 9, 0.62);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .backdrop.show { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0; z-index: 21;
      margin: 0 auto;
      max-width: 420px;
      max-height: 86vh;
      overflow-y: auto;
      padding: 8px 18px calc(env(safe-area-inset-bottom, 0px) + 20px);
      background: #0b1219;
      border: 1px solid var(--line);
      border-bottom: none;
      border-radius: 28px 28px 0 0;
      box-shadow: 0 -24px 60px rgba(0, 0, 0, 0.5);
      transform: translateY(105%);
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .sheet.show { transform: translateY(0); }

    .grabber {
      width: 38px; height: 4px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      margin: 4px auto 14px;
    }

    .sheet-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .sheet-head h3 { font-size: 16px; font-weight: 650; }

    #ttsStatus {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: #9fd2ff;
      background: rgba(91, 140, 255, 0.10);
      border: 1px solid rgba(91, 140, 255, 0.18);
      border-radius: 12px;
      padding: 9px 12px;
      line-height: 1.4;
    }

    .row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.055);
    }
    .row:last-of-type { border-bottom: none; }
    .row .label { font-size: 14px; }
    .row .desc { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .switch {
      appearance: none; -webkit-appearance: none;
      width: 48px; height: 28px; flex: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.13);
      position: relative;
      transition: background 0.22s ease;
      outline: none;
    }
    .switch::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 22px; height: 22px; border-radius: 50%;
      background: #fff;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }
    .switch:checked {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    .switch:checked::after { transform: translateX(20px); }

    .slider-row { padding: 14px 0 6px; }
    .slider-line {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 14px; margin-bottom: 8px;
    }
    .slider-line output {
      font-size: 12.5px; color: var(--muted);
      font-variant-numeric: tabular-nums;
      min-width: 34px; text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%; height: 26px;
      background: transparent;
      outline: none;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px; border-radius: 50%;
      background: #fff;
      margin-top: -7px;
      border: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }

    .btn-block {
      width: 100%; height: 46px;
      margin-top: 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-family: inherit;
      font-size: 14px; font-weight: 500;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .btn-block:active { transform: scale(0.985); background: rgba(255, 255, 255, 0.09); }
    .btn-block.accent {
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(91, 140, 255, 0.25);
    }
    .btn-block.ghostly {
      background: transparent;
      color: var(--muted);
      border-color: rgba(255, 255, 255, 0.06);
      font-size: 12.5px;
      height: 40px;
      margin-top: 8px;
    }

    #ttsLog {
      margin-top: 14px;
      max-height: 118px;
      overflow-y: auto;
      padding: 10px 12px;
      border-radius: 13px;
      background: #05090e;
      border: 1px solid var(--line);
      color: #7ee787;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10.5px;
      line-height: 1.6;
      word-break: break-all;
    }
    #ttsLog:empty { display: none; }

    @media (max-height: 700px) {
      .camera-card { aspect-ratio: 1 / 1; }
    }
  </style>
</head>
<body>

  <div class="app">

    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="4.6" r="2.1"/>
            <path d="M12 7.2v5.6"/>
            <path d="M12 12.8L9.2 19"/>
            <path d="M12 12.8L14.8 19"/>
            <path d="M6.8 9.5h10.4"/>
          </svg>
        </div>
        <div>
          <h1>坐姿守护</h1>
          <div class="sub">Posture Guard</div>
        </div>
      </div>
      <button id="ttsBtn" class="icon-btn" aria-label="语音设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9.5v5h3.4l4.6 3.8V5.7L7.4 9.5H4z"/>
          <path d="M16.3 9.2a4 4 0 0 1 0 5.6"/>
          <path d="M18.8 6.6a7.6 7.6 0 0 1 0 10.8"/>
        </svg>
      </button>
    </header>

    <section class="camera-card" id="cameraCard">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div class="vignette"></div>
      <div class="cam-placeholder" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h2l1.2-1.6h4.6L15.5 6h2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-8z"/>
          <circle cx="12" cy="12.2" r="3.2"/>
        </svg>
        <p>摄像头未开启</p>
      </div>
      <div class="cam-chip"><span class="dot"></span><span id="camLabel">待机</span></div>

      <div class="calib" id="calibOverlay">
        <div class="calib-ring" id="calibRing">
          <div class="calib-inner">
            <span id="calibCount">5</span>
            <small>SECONDS</small>
          </div>
        </div>
        <p>保持自然坐姿，正在校准</p>
      </div>
    </section>

    <section class="status-card" id="statusCard" data-state="idle">
      <div class="status-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h4l2.4-6 4.2 12 2.4-6h5"/>
        </svg>
      </div>
      <div class="status-body">
        <div id="postureBar" class="idle">点击开始检测</div>
        <div class="status-hint" id="statusHint">开始后将自动校准 5 秒</div>
        <div class="bad-track"><div class="bad-fill" id="badProgress"></div></div>
      </div>
      <div class="status-badge"><span id="badDuration">0</span><small>s</small></div>
    </section>

    <section class="metrics" id="details">
      <div class="metric">
        <div class="k"><span>低头角度</span><em>PITCH</em></div>
        <div class="v"><span id="pitchAngle">0</span><span class="u">°</span></div>
      </div>
      <div class="metric">
        <div class="k"><span>歪头角度</span><em>TILT</em></div>
        <div class="v"><span id="tiltAngle">0</span><span class="u">°</span></div>
      </div>
      <div class="metric">
        <div class="k"><span>前倾角度</span><em>LEAN</em></div>
        <div class="v"><span id="leanAngle">0</span><span class="u">°</span></div>
      </div>
      <div class="metric">
        <div class="k"><span>面部朝下</span><em>FACE DOWN</em></div>
        <div class="v"><span id="faceDown">0</span><span class="u">%</span></div>
      </div>
    </section>

    <footer class="dock">
      <button id="startBtn" class="primary">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5.6c0-.8.9-1.3 1.6-.9l9 6.4c.6.4.6 1.4 0 1.8l-9 6.4c-.7.4-1.6-.1-1.6-.9V5.6z"/>
        </svg>
        <span id="startLabel">开始检测</span>
      </button>
      <button id="detailBtn" class="ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 19V10"/><path d="M10 19V5"/><path d="M15 19v-6"/><path d="M20 19V8"/>
        </svg>
        数据
      </button>
    </footer>

  </div>

  <!-- 语音设置 -->
  <div class="backdrop" id="ttsBackdrop"></div>
  <div class="sheet" id="ttsPanel">
    <div class="grabber"></div>
    <div class="sheet-head">
      <h3>语音提醒</h3>
      <button class="icon-btn sm" id="ttsClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>

    <div id="ttsStatus">语音初始化中...</div>

    <div class="row">
      <div>
        <div class="label">启用语音</div>
        <div class="desc">坐姿不良时用语音提醒</div>
      </div>
      <input type="checkbox" id="ttsEnabled" class="switch" checked>
    </div>

    <div class="slider-row">
      <div class="slider-line"><span>音量</span><output id="ttsVolumeVal">100</output></div>
      <input type="range" id="ttsVolume" min="0" max="100" value="100">
    </div>

    <div class="slider-row">
      <div class="slider-line"><span>语速</span><output id="ttsRateVal">0.8</output></div>
      <input type="range" id="ttsRate" min="30" max="150" value="80">
    </div>

    <button id="ttsTestBtn" class="btn-block accent">测试语音</button>
    <button id="ttsDebugBtn" class="btn-block ghostly">调试诊断</button>

    <div id="ttsLog"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

  <script>
    // ===== 元素 =====
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var postureBar = document.getElementById('postureBar');
    var startBtn = document.getElementById('startBtn');
    var startLabel = document.getElementById('startLabel');
    var ttsBtn = document.getElementById('ttsBtn');
    var detailBtn = document.getElementById('detailBtn');
    var ttsPanel = document.getElementById('ttsPanel');
    var ttsBackdrop = document.getElementById('ttsBackdrop');
    var ttsClose = document.getElementById('ttsClose');
    var ttsLog = document.getElementById('ttsLog');
    var details = document.getElementById('details');
    var statusCard = document.getElementById('statusCard');
    var cameraCard = document.getElementById('cameraCard');
    var camLabel = document.getElementById('camLabel');
    var calibOverlay = document.getElementById('calibOverlay');
    var calibCount = document.getElementById('calibCount');
    var calibRing = document.getElementById('calibRing');
    var badProgress = document.getElementById('badProgress');
    var statusHint = document.getElementById('statusHint');

    // 把 postureBar 的状态同步给外层容器（用于配色）
    new MutationObserver(function() {
      var state = (postureBar.className || 'idle').trim() || 'idle';
      statusCard.setAttribute('data-state', state);
      cameraCard.setAttribute('data-state', state);
    }).observe(postureBar, { attributes: true, attributeFilter: ['class'] });

    // ===== TTS 配置 =====
    var ttsConfig = {
      enabled: true,
      volume: 1.0,
      rate: 0.8
    };

    var ttsState = {
      ready: false,
      failed: false,
      reason: '',
      language: '',
      plugin: null
    };

    function log(msg) {
      var line = document.createElement('div');
      line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      ttsLog.appendChild(line);
      ttsLog.scrollTop = ttsLog.scrollHeight;
      console.log('[TTS]', msg);
    }

    // 加载保存的设置
    try {
      var saved = JSON.parse(localStorage.getItem('ttsConfig'));
      if (saved) { Object.assign(ttsConfig, saved); }
    } catch(e) {}

    function saveTTSConfig() {
      localStorage.setItem('ttsConfig', JSON.stringify(ttsConfig));
    }

    // ===== TTS 引擎（Capacitor 插件）=====
    function getTTSPlugin() {
      if (ttsState.plugin) return ttsState.plugin;
      if (window.Capacitor) {
        if (typeof Capacitor.registerPlugin === 'function') {
          ttsState.plugin = Capacitor.registerPlugin('NativeTTS');
        } else if (Capacitor.Plugins) {
          ttsState.plugin = Capacitor.Plugins.NativeTTS || null;
        }
      }
      return ttsState.plugin;
    }

    function reasonText(reason) {
      var map = {
        missing_chinese_voice: '缺少中文语音包，已使用系统默认语言',
        no_voice_data: '系统没有可用的语音数据，请安装 TTS 引擎（如 Google 语音服务）',
        tts_unavailable: 'TTS 引擎不可用',
        no_plugin: '原生语音插件未加载',
        plugin_error: '原生插件调用失败，请确认安装的是最新构建'
      };
      if (reason && reason.indexOf('tts_init_failed') === 0) {
        return 'TTS 引擎初始化失败（' + reason + '）';
      }
      return map[reason] || reason || '未知原因';
    }

    function updateTTSStatus(text) {
      var el = document.getElementById('ttsStatus');
      if (el) el.textContent = text;
    }

    function initTTS(attempt) {
      attempt = attempt || 0;
      var plugin = getTTSPlugin();

      if (!plugin) {
        ttsState.failed = true;
        ttsState.reason = 'no_plugin';
        updateTTSStatus('语音不可用：原生插件未加载');
        log('原生语音插件不可用');
        return;
      }

      plugin.isReady().then(function(res) {
        ttsState.ready = !!(res && res.ready);
        ttsState.failed = !!(res && res.failed);
        ttsState.reason = (res && res.reason) || '';
        ttsState.language = (res && res.language) || '';

        if (ttsState.ready) {
          var note = ttsState.reason === 'missing_chinese_voice' ? '（缺少中文语音包）' : '';
          updateTTSStatus('语音已就绪 ' + ttsState.language + note);
          log('语音就绪: ' + ttsState.language + (note ? ' ' + note : ''));
          return;
        }
        if (ttsState.failed) {
          updateTTSStatus('语音不可用：' + reasonText(ttsState.reason));
          log('语音不可用: ' + reasonText(ttsState.reason));
          return;
        }
        updateTTSStatus('语音初始化中...');
        if (attempt < 6) {
          setTimeout(function() { initTTS(attempt + 1); }, 500);
        } else {
          updateTTSStatus('语音初始化超时，请检查系统 TTS 设置');
          log('语音初始化超时');
        }
      }).catch(function(e) {
        log('语音状态查询失败: ' + (e && e.message ? e.message : e));
        if (attempt < 3) {
          setTimeout(function() { initTTS(attempt + 1); }, 800);
        } else {
          ttsState.failed = true;
          ttsState.reason = 'plugin_error';
          updateTTSStatus('语音不可用：原生插件调用失败');
        }
      });
    }

    function vibrateAlert() {
      if (navigator.vibrate) {
        navigator.vibrate([400, 120, 400]);
      }
    }

    function speak(text, attempt) {
      attempt = attempt || 0;
      if (!ttsConfig.enabled) return;
      var plugin = getTTSPlugin();

      if (plugin && ttsState.ready) {
        plugin.speak({
          text: text,
          rate: ttsConfig.rate,
          volume: ttsConfig.volume
        }).then(function() {
          log('播报: ' + text);
        }).catch(function(e) {
          log('播报失败: ' + (e && e.message ? e.message : e) + '，改用震动');
          vibrateAlert();
        });
        return;
      }

      if (plugin && !ttsState.failed && attempt < 2) {
        setTimeout(function() { speak(text, attempt + 1); }, 600);
        return;
      }

      log('语音未就绪（' + reasonText(ttsState.reason) + '），震动提醒');
      vibrateAlert();
    }

    // ===== TTS UI 绑定 =====
    document.getElementById('ttsEnabled').checked = ttsConfig.enabled;
    document.getElementById('ttsVolume').value = ttsConfig.volume * 100;
    document.getElementById('ttsVolumeVal').textContent = Math.round(ttsConfig.volume * 100);
    document.getElementById('ttsRate').value = ttsConfig.rate * 100;
    document.getElementById('ttsRateVal').textContent = ttsConfig.rate;

    document.getElementById('ttsEnabled').addEventListener('change', function() {
      ttsConfig.enabled = this.checked; saveTTSConfig();
    });
    document.getElementById('ttsVolume').addEventListener('input', function() {
      ttsConfig.volume = this.value / 100;
      document.getElementById('ttsVolumeVal').textContent = this.value;
      saveTTSConfig();
    });
    document.getElementById('ttsRate').addEventListener('input', function() {
      ttsConfig.rate = this.value / 100;
      document.getElementById('ttsRateVal').textContent = (this.value / 100).toFixed(1);
      saveTTSConfig();
    });

    function openTTSPanel() {
      ttsPanel.classList.add('show');
      ttsBackdrop.classList.add('show');
    }

    function closeTTSPanel() {
      ttsPanel.classList.remove('show');
      ttsBackdrop.classList.remove('show');
    }

    ttsBtn.addEventListener('click', openTTSPanel);
    ttsClose.addEventListener('click', closeTTSPanel);
    ttsBackdrop.addEventListener('click', closeTTSPanel);

    detailBtn.addEventListener('click', function() {
      details.classList.toggle('show');
      document.body.classList.toggle('show-details', details.classList.contains('show'));
    });

    document.getElementById('ttsTestBtn').addEventListener('click', function() {
      speak('你好，坐姿检测语音测试。');
    });

    document.getElementById('ttsDebugBtn').addEventListener('click', function() {
      var plugin = getTTSPlugin();
      var info = 'plugin=' + (plugin ? 'ok' : 'missing') +
                 ' | ready=' + ttsState.ready +
                 ' | failed=' + ttsState.failed +
                 ' | reason=' + (ttsState.reason || '-') +
                 ' | lang=' + (ttsState.language || '-') +
                 ' | vibrate=' + !!navigator.vibrate;
      log('诊断: ' + info);
      alert(info);
    });

    // ===== 检测状态 =====
    var isRunning = false;
    var cameraInstance = null;
    var poseInstance = null;

    // ===== 阈值 =====
    var SMOOTH_FACTOR = 0.3;
    var PITCH_THRESH = 20;
    var FACE_DOWN_THRESH = 0.4;
    var TILT_THRESH = 12;
    var LEAN_THRESH = 25;
    var DELAY_THRESH = 3;

    var smoothPitch = 0, smoothTilt = 0, smoothLean = 0;
    var badStartTime = null, lastSpeakTime = 0;
    var isCalibrating = false, calibrationFrames = [];
    var CALIBRATION_DURATION = 5000, calibrationStartTime = 0, baseline = null;

    // ===== 启动检测 =====
    startBtn.addEventListener('click', async function() {
      if (isRunning) return;
      postureBar.textContent = '启动中...';
      postureBar.className = 'warn';
      camLabel.textContent = '启动中';
      statusHint.textContent = '正在启动摄像头...';

      if (!poseInstance) {
        poseInstance = new Pose({
          locateFile: function(file) {
            return 'https://cdn.jsdelivr.net/npm/@mediapipe/pose/' + file;
          }
        });
        poseInstance.setOptions({
          modelComplexity: 1,
          smoothLandmarks: true,
          enableSegmentation: false,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        poseInstance.onResults(onResults);
      }

      cameraInstance = new Camera(video, {
        onFrame: function() { return poseInstance.send({ image: video }); },
        width: 360,
        height: 480
      });

      try {
        await cameraInstance.start();
        isRunning = true;
        isCalibrating = true;
        calibrationFrames = [];
        calibrationStartTime = Date.now();
        baseline = null;
        smoothPitch = 0; smoothTilt = 0; smoothLean = 0;
        startLabel.textContent = '检测中';
        startBtn.disabled = true;
        document.body.classList.add('running');
        camLabel.textContent = '实时检测';
        statusHint.textContent = '正在校准，请保持自然坐姿';
      } catch(e) {
        postureBar.textContent = '摄像头启动失败';
        postureBar.className = 'bad';
        camLabel.textContent = '待机';
        document.body.classList.remove('running');
        statusHint.textContent = '请检查相机权限后重试';
        log('摄像头错误: ' + e.message);
      }
    });

    // ===== 检测逻辑 =====
    function onResults(results) {
      if (!isRunning) return;
      canvas.width = video.videoWidth || 360;
      canvas.height = video.videoHeight || 480;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!results.poseLandmarks) {
        postureBar.textContent = '未检测到人，请调整位置';
        postureBar.className = 'warn';
        statusHint.textContent = '请让上半身完整入镜';
        return;
      }

      var lm = results.poseLandmarks;
      if (window.drawConnectors && window.POSE_CONNECTIONS) {
        drawConnectors(ctx, lm, POSE_CONNECTIONS, { color: '#00d2ff', lineWidth: 2 });
        drawLandmarks(ctx, lm, { color: '#ff0066', lineWidth: 1, radius: 3 });
      }

      var nose = lm[0], leftEye = lm[5], rightEye = lm[2];
      var leftShoulder = lm[11], rightShoulder = lm[12];
      var leftHip = lm[23], rightHip = lm[24];

      var shoulderMidX = (leftShoulder.x + rightShoulder.x) / 2;
      var shoulderMidY = (leftShoulder.y + rightShoulder.y) / 2;
      var eyeMidY = (leftEye.y + rightEye.y) / 2;
      var hipMidX = (leftHip.x + rightHip.x) / 2;
      var hipMidY = (leftHip.y + rightHip.y) / 2;
      var shoulderWidth = Math.abs(leftShoulder.x - rightShoulder.x);

      var noseShoulderDiff = shoulderMidY - nose.y;
      var normalizedNoseDrop = shoulderWidth > 0.01 ? noseShoulderDiff / shoulderWidth : 0;
      var eyeShoulderDiff = shoulderMidY - eyeMidY;
      var normalizedEyeDrop = shoulderWidth > 0.01 ? eyeShoulderDiff / shoulderWidth : 0;

      var noseToShoulderDist = Math.sqrt(
        Math.pow(nose.x - shoulderMidX, 2) + Math.pow(nose.y - shoulderMidY, 2)
      );
      var normalizedNoseDist = shoulderWidth > 0.01 ? noseToShoulderDist / shoulderWidth : 1;

      var dx = rightShoulder.x - leftShoulder.x;
      var dy = rightShoulder.y - leftShoulder.y;
      var currentTilt = Math.abs(Math.atan2(dy, dx) * (180 / Math.PI));

      var torsoDx = nose.x - hipMidX;
      var torsoDy = nose.y - hipMidY;
      var currentLean = Math.abs(Math.atan2(torsoDx, torsoDy) * (180 / Math.PI));

      if (isCalibrating) {
        calibrationFrames.push({
          noseDrop: normalizedNoseDrop, eyeDrop: normalizedEyeDrop,
          tilt: currentTilt, lean: currentLean, noseDist: normalizedNoseDist
        });
        var elapsed = Date.now() - calibrationStartTime;
        var remaining = Math.ceil((CALIBRATION_DURATION - elapsed) / 1000);
        postureBar.textContent = '校准中... ' + remaining + '秒，请保持正常坐姿';
        postureBar.className = 'warn';

        calibOverlay.classList.add('show');
        calibCount.textContent = Math.max(0, remaining);
        calibRing.style.background = 'conic-gradient(var(--accent) ' +
          Math.min(360, elapsed / CALIBRATION_DURATION * 360) +
          'deg, rgba(255,255,255,0.1) 0deg)';

        if (elapsed >= CALIBRATION_DURATION) {
          calibrationFrames.sort(function(a, b) { return a.noseDrop - b.noseDrop; });
          var midIdx = Math.floor(calibrationFrames.length / 2);
          baseline = {
            noseDrop: calibrationFrames[midIdx].noseDrop,
            eyeDrop: calibrationFrames[midIdx].eyeDrop,
            tilt: calibrationFrames[midIdx].tilt,
            lean: calibrationFrames[midIdx].lean,
            noseDist: calibrationFrames[midIdx].noseDist
          };
          isCalibrating = false;
          calibrationFrames = [];
          smoothPitch = 0; smoothTilt = 0; smoothLean = 0;
          postureBar.textContent = '校准完成！继续保持';
          postureBar.className = 'good';
          statusHint.textContent = '坐姿已校准，保持良好姿态';
          calibOverlay.classList.remove('show');
        }
        return;
      }

      if (!baseline) return;

      var pitchDeltaVertical = normalizedNoseDrop - baseline.noseDrop;
      var distDelta = normalizedNoseDist - baseline.noseDist;
      var pitchDeltaDown = Math.max(0, -distDelta * 300);
      var rawPitch = Math.min(90, Math.max(0, pitchDeltaVertical * 150 + pitchDeltaDown));
      smoothPitch = smoothPitch * (1 - SMOOTH_FACTOR) + rawPitch * SMOOTH_FACTOR;

      var faceDelta = normalizedEyeDrop - baseline.eyeDrop;
      var faceDownScore = Math.min(1, Math.max(0, faceDelta * 5));

      var tiltDelta = currentTilt - baseline.tilt;
      var rawTilt = Math.abs(tiltDelta);
      smoothTilt = smoothTilt * (1 - SMOOTH_FACTOR) + rawTilt * SMOOTH_FACTOR;

      var leanDelta = currentLean - baseline.lean;
      var rawLean = Math.max(0, leanDelta);
      smoothLean = smoothLean * (1 - SMOOTH_FACTOR) + rawLean * SMOOTH_FACTOR;

      var pitchBad = smoothPitch > PITCH_THRESH;
      var faceBad = faceDownScore > FACE_DOWN_THRESH;
      var tiltBad = smoothTilt > TILT_THRESH;
      var leanBad = smoothLean > LEAN_THRESH;
      var isBadPosture = pitchBad || faceBad || tiltBad || leanBad;

      document.getElementById('pitchAngle').textContent = smoothPitch.toFixed(1);
      document.getElementById('faceDown').textContent = faceDownScore.toFixed(2);
      document.getElementById('tiltAngle').textContent = smoothTilt.toFixed(1);
      document.getElementById('leanAngle').textContent = smoothLean.toFixed(1);

      if (isBadPosture) {
        statusHint.textContent = '已持续不良坐姿，尽快调整';
        if (!badStartTime) badStartTime = Date.now();
        var badDuration = (Date.now() - badStartTime) / 1000;
        document.getElementById('badDuration').textContent = badDuration.toFixed(1);
        badProgress.style.width = Math.min(100, badDuration / DELAY_THRESH * 100) + '%';
        if (badDuration >= DELAY_THRESH) {
          postureBar.textContent = '坐姿不良！请调整';
          postureBar.className = 'bad';
          var now = Date.now();
          if (now - lastSpeakTime > 10000) {
            lastSpeakTime = now;
            var msg = '';
            if (pitchBad) msg = '请注意头部位置。';
            else if (faceBad) msg = '面部过于朝下。';
            if (tiltBad) msg += '不要歪头。';
            if (leanBad) msg += '请挺直背部。';
            speak(msg || '请注意坐姿。');
          }
        } else {
          postureBar.textContent = '坐姿异常，请调整（' + (DELAY_THRESH - badDuration).toFixed(0) + '秒后提醒）';
          postureBar.className = 'warn';
        }
      } else {
        badStartTime = null;
        document.getElementById('badDuration').textContent = '0';
        badProgress.style.width = '0%';
        postureBar.textContent = '坐姿良好，继续保持';
        postureBar.className = 'good';
        statusHint.textContent = '保持得不错，继续加油';
      }
    }

    // ===== 初始化 =====
    initTTS();

    window.addEventListener('beforeunload', function() {
      if (cameraInstance) cameraInstance.stop();
      var plugin = getTTSPlugin();
      if (plugin) plugin.stop().catch(function() {});
    });
  </script>
</body>
</html>
